[workspace]
resolver = "2"
members = [
    "core",
    "client",
    "cli",
    "launcher",
    "tui",
    "server",
    "desktop",
]

[workspace.dependencies]
agent-client-protocol = { version = "=1.2.0", features = ["unstable_end_turn_token_usage"] }
anyhow = "1"
dashmap = "6.0"
reqwest = { version = "0.12", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = "1.49"
uuid = "1.11"
