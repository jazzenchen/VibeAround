[package]
name = "va-launcher"
version = "0.7.17"
description = "VibeAround native launch implementation crate for @va/launcher"
edition = "2021"
rust-version = "1.82"

[lib]
name = "va_launcher"
path = "src/lib.rs"

[[bin]]
name = "va-launch"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
common = { path = "../core" }
open = "1.7"
serde = { workspace = true }
serde_json = { workspace = true }
shell-escape = "0.1"
toml = "0.8"
uuid = { workspace = true, features = ["v4"] }
