[package]
name = "va-launcher"
version = "0.7.9"
description = "VibeAround native launch implementation crate for @va/launcher"
edition = "2021"
rust-version = "1.82"

[lib]
name = "va_launcher"
path = "src/lib.rs"

[[bin]]
name = "va-launch"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shell-escape = "0.1"
uuid = { version = "1", features = ["v4"] }
