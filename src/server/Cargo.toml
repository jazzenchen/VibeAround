[package]
name = "server"
version = "0.7.12"
description = "VibeAround HTTP/WebSocket server: SPA, /ws, /ws/chat, /mcp"
edition = "2021"
rust-version = "1.82"

[[bin]]
name = "vibearound-server"
path = "src/main.rs"

[dependencies]
common = { path = "../core" }
# Pinned to a vetted bridge commit; bump together with api_bridge compatibility tests.
va-ai-api-bridge = { git = "https://github.com/jazzenchen/va-ai-api-bridge", rev = "8bad207b6459505ccb2fd3794b5e18fad03cc8cc" }
axum = { version = "0.8", features = ["json", "ws", "tokio"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
tokio = { workspace = true, features = ["full"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
bytes = "1.9"
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
dashmap = { workspace = true }
reqwest = { workspace = true, features = ["rustls-tls", "stream"] }
chrono = "0.4"
agent-client-protocol = { workspace = true }
async-trait = "0.1"
anyhow = { workspace = true }
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation"] }
