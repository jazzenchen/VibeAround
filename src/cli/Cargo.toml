[package]
name = "va-cli"
version = "0.7.8"
description = "VibeAround command-line client"
edition = "2021"
rust-version = "1.82"

[[bin]]
name = "va"
path = "src/main.rs"

[dependencies]
va-client = { path = "../client" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1.49", features = ["macros", "rt-multi-thread"] }
serde_json = "1.0"
thiserror = "1"
