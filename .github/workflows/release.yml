name: Release

on:
  workflow_dispatch:
  push:
    tags:
      # Desktop releases use v<semver>; CLI releases use va-v<semver>.
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

jobs:
  verify-channel-catalog:
    name: Verify channel catalog
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify pinned channel releases
        run: node src/scripts/verify-channel-catalog.mjs

  build-desktop:
    name: Build ${{ matrix.name }}
    needs: verify-channel-catalog
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu x64
            runner: ubuntu-22.04
            args: --bundles appimage,deb
          - name: Windows x64
            runner: windows-latest
            args: --bundles nsis,msi

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src -> target

      - name: Install frontend dependencies
        run: bun install --cwd src --frozen-lockfile

      - name: Test web dashboard
        run: bun run --cwd src web:test

      - name: Test desktop UI
        run: bun run --cwd src desktop-ui:test

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          VERSION="$(node -p "require('./src/desktop/package.json').version")"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${VERSION}"
          fi
          ARGS="${{ matrix.args }}"
          if [ "${RUNNER_OS}" = "Windows" ] && [[ "${VERSION}" == *-* ]]; then
            # MSI rejects textual prerelease identifiers such as x.y.z-beta.
            # Keep beta Windows releases on NSIS + portable ZIP; stable releases
            # still use the matrix default of NSIS + MSI.
            ARGS="--bundles nsis"
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "args=${ARGS}" >> "${GITHUB_OUTPUT}"

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src/desktop
          tauriScript: bun tauri
          tagName: ${{ steps.release.outputs.tag }}
          releaseName: VibeAround ${{ steps.release.outputs.tag }}
          releaseBody: |
            VibeAround desktop release.

            Assets built by GitHub Actions:
            - Windows x64 installer
            - Windows x64 portable ZIP
            - Ubuntu/Linux x64 packages

            macOS DMG is built locally and attached separately.
          releaseDraft: true
          prerelease: false
          args: ${{ steps.release.outputs.args }}

      - name: Rename release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          rename_asset() {
            local from="$1"
            local to="$2"
            local api_url existing_url
            api_url="$(gh release view "${{ steps.release.outputs.tag }}" \
              --json assets \
              --jq ".assets[] | select(.name == \"${from}\") | .apiUrl" || true)"
            if [ -z "${api_url}" ]; then
              echo "Asset not found, skipping: ${from}"
              return 0
            fi
            existing_url="$(gh release view "${{ steps.release.outputs.tag }}" \
              --json assets \
              --jq ".assets[] | select(.name == \"${to}\") | .apiUrl" || true)"
            if [ -n "${existing_url}" ]; then
              gh api --method DELETE "${api_url}" >/dev/null
              echo "Deleted duplicate ${from}; ${to} already exists"
              return 0
            fi
            gh api \
              --method PATCH \
              -H "Accept: application/vnd.github+json" \
              "${api_url}" \
              -f "name=${to}" >/dev/null
            echo "Renamed ${from} -> ${to}"
          }

          version="${{ steps.release.outputs.version }}"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            rename_asset "VibeAround_${version}_x64-setup.exe" "VibeAround-Windows-x64-Setup-${version}.exe"
            rename_asset "VibeAround_${version}_x64_en-US.msi" "VibeAround-Windows-x64-MSI-${version}.msi"
          elif [ "${RUNNER_OS}" = "Linux" ]; then
            rename_asset "VibeAround_${version}_amd64.AppImage" "VibeAround-Linux-x64-AppImage-${version}.AppImage"
            rename_asset "VibeAround_${version}_amd64.deb" "VibeAround-Linux-x64-DEB-${version}.deb"
          fi

      - name: Build Windows CLI tools
        if: runner.os == 'Windows'
        run: cargo build --manifest-path src/Cargo.toml --release -p va-cli -p va-tui

      - name: Package Windows portable ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ steps.release.outputs.version }}"
          $dist = "VibeAround-Windows-x64-Portable-$version"
          $zip = "$dist.zip"

          Remove-Item -Recurse -Force $dist -ErrorAction SilentlyContinue
          Remove-Item -Force $zip -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item "src/target/release/vibearound-desktop.exe" "$dist/VibeAround.exe"
          Copy-Item "src/target/release/va-launch.exe" "$dist/va-launch.exe"
          Copy-Item "src/target/release/va.exe" "$dist/va.exe"
          Copy-Item "src/target/release/va-tui.exe" "$dist/va-tui.exe"

          New-Item -ItemType Directory -Force "$dist/_up_/web" | Out-Null
          Copy-Item -Recurse "src/web/dist" "$dist/_up_/web/dist"

          New-Item -ItemType Directory -Force "$dist/icons" | Out-Null
          Copy-Item "src/desktop/icons/32x32.png" "$dist/icons/32x32.png"

          Compress-Archive -Path "$dist/*" -DestinationPath $zip -Force

      - name: Upload Windows portable ZIP
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.release.outputs.tag }}" \
            "VibeAround-Windows-x64-Portable-${{ steps.release.outputs.version }}.zip" \
            --clobber
